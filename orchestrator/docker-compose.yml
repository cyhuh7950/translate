# 오케스트레이터 단독 서비스.
#   translatectl.sh start orchestrator
name: translate-orchestrator

services:
  orchestrator:
    build:
      context: ..
      dockerfile: orchestrator/Dockerfile
    image: translate-orchestrator:latest
    container_name: translate-orchestrator
    # 명시적으로 stop 하면 다시 뜨지 않는다.
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-8401}:8401"
    env_file:
      - component.env
      # 비밀값(오케스트레이터 인증 키, 엔진 키, LLM 프로바이더 키).
      # 없어도 기동은 된다 — 그 경우 인증이 꺼지고 프로바이더가 사용 불가로 표시된다.
      - path: ../config/secrets.env
        required: false
    volumes:
      # 설정을 읽기 전용으로 주입. 파일이 바뀌면 재기동 없이 반영된다(핫 리로드).
      - ../config:/config:ro
      # 진단용 세그먼트 덤프. 호스트에서 꺼내 들어봐야 하므로 볼륨으로 뺀다.
      # diagnostics.save_segments 가 false(기본)면 아무것도 쓰이지 않는다.
      # 켜면 사용자 음성이 이 폴더에 평문 WAV 로 남는다 — .gitignore 에 들어 있다.
      - ${DIAGNOSTICS_DIR:-../diagnostics}:/diagnostics
      # 쓰기 가능한 데이터 볼륨. 지금은 등록된 목소리(voice print)가 여기 들어간다.
      # config/ 는 읽기전용이라 여기에 쓸 수 없으므로 볼륨을 따로 둔다.
      # ★ 저장되는 임베딩은 생체정보에 준하는 개인정보다 — .gitignore 에 들어 있다.
      - ${DATA_DIR:-../data}:/data
    mem_limit: ${MEM_LIMIT:-1g}
    networks:
      - proxy-network

networks:
  proxy-network:
    name: proxy-network
    external: true
