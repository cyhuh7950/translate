# 기본값 — 코드에 두지 않는 값들이 전부 여기 있다.
#
# 오케스트레이터 코드에는 `os.getenv("PORT", "8401")` 같은 폴백이 없다.
# 설정이 없으면 코드는 명확한 오류로 죽는다. 그래야 "이 값이 어디서 왔는지"가
# 항상 이 파일 하나로 추적된다.
#
# 이 파일을 고치지 말고 config/*.local.yaml 이나 환경변수로 덮어쓰는 것을 권한다.
# 병합 우선순위: 관리 API > 환경변수 > *.local.yaml > 이 파일

server:
  # 이 오케스트레이터 인스턴스의 식별자. 엔진 엔드포인트의 same_server 조건에 쓰인다.
  id: local
  host: 0.0.0.0
  port: 8401
  log_level: INFO
  access_log: false
  cors_origins: ["*"]
  # 요청 본문 최대 크기 (바이트). 오디오 업로드 한계.
  max_upload_bytes: 104857600

auth:
  # 비우면 인증 없음. 값은 secrets.env 의 API_KEY 로 주입한다.
  api_key: ""
  # 인증 없이 열어둘 경로
  public_paths: ["/health", "/docs", "/openapi.json"]
  # WebSocket 이 키를 받을 쿼리 파라미터 이름. 비우면 사용하지 않는다(기본).
  #
  # 브라우저는 WS 핸드셰이크에 헤더를 못 붙이지만, 웹 클라이언트는 nginx 를 거치고
  # nginx 가 Authorization 을 주입하므로 이 대안이 필요 없다. 키가 URL 에 들어가면
  # 접근 로그·Referer·브라우저 히스토리에 남으므로 기본은 꺼 둔다.
  # 프록시를 못 두는 클라이언트가 생기면 그때만 이름을 채운다.
  ws_query_param: ""

session:
  # profiles.yaml 의 키 중 하나
  default_profile: oneway
  # 세션이 프로필을 바꿀 수 있는지
  allow_profile_override: true
  default_mode: batch
  allow_mode_override: true
  # 클라이언트가 처음 열었을 때 고를 언어. 선택 가능한 목록은 languages.yaml 에 있다.
  # 목록과 기본값은 다른 관심사라 파일을 나눠 둔다.
  default_source_lang: ko
  default_target_lang: en
  # 프로필 없이 참여자를 직접 넘길 때 쓰는 값들
  default_speaker_id: manual
  default_turn_policy: half_duplex
  # 유휴 세션 정리
  idle_timeout_s: 600
  max_concurrent: 32

routing:
  # explicit | mode_first | nearest | fallback — registry 에 등록된 정책 이름
  policy: mode_first
  # 실시간에서 서버를 넘나드는 폴백은 지연이 튀어 오히려 나쁘다.
  allow_fallback: false

engine_http:
  connect_timeout_s: 5
  read_timeout_s: 300
  max_retries: 1
  retry_backoff_s: 0.5

engine_health:
  # 엔진 가용성 폴링. 0 이면 폴링하지 않고 요청 시점에만 판단한다.
  poll_interval_s: 30
  timeout_s: 5
  # 기동 직후 한 번 전수 조사
  probe_on_start: true

llm:
  # providers.yaml 의 키 중 하나
  default_provider: groq
  # 번역 스타일 — prompts 에서 참조한다
  style: natural
  # 대화 맥락으로 넘길 최근 턴 수
  context_turns: 4
  temperature: 0.3
  max_output_tokens: 2048
  request_timeout_s: 120

  # --- 모델 목록 조회 ---
  #
  # 모델 이름을 설정에 박아두면 프로바이더가 목록을 바꿀 때마다 번역이 멈춘다.
  # 2026-08 에 실제로 멈췄다 — Groq 이 llama-3.3-70b-versatile 을 없애 404
  # (model_not_found)가 돌아왔고, 앱의 번역이 통째로 죽었다. 그래서 목록은 런타임에
  # 프로바이더에 직접 물어본다. 창구는 `GET /v1/models` 다.
  #
  # ★ `/v1/config` 에는 목록을 싣지 않는다. 앱이 시작할 때마다 부르는 응답이라
  #   거기서 프로바이더 9곳을 조회하면 앱 시작이 그만큼 늦어진다. 목록은 필요한
  #   화면(설정)이 따로 부른다.
  #
  # providers.yaml 의 default_model 은 그대로 남는다 — 조회가 실패해도 번역은
  # 돌아가야 하므로 폴백이다.

  # 조회 결과를 재사용하는 시간(초). 프로바이더 목록은 하루에 몇 번 바뀌는 것이
  # 아니라 길게 잡아도 된다. 0 이면 캐시하지 않는다(요청마다 전부 다시 조회한다).
  # 클라이언트는 `?refresh=true` 로 언제든 무시하고 새로 받을 수 있다.
  models_cache_ttl_s: 900

  # 한 프로바이더의 목록 조회를 기다리는 시간(초). 번역용 request_timeout_s 와
  # 따로 두는 이유는, 목록은 화면을 그리려고 부르는 것이라 번역만큼 기다릴 수
  # 없기 때문이다. 죽은 프로바이더 하나가 설정 화면을 2분 붙잡으면 안 된다.
  # 프로바이더들은 동시에 조회되므로 전체 대기 시간도 이 값을 넘지 않는다.
  models_timeout_s: 8

  # 기동 직후 목록을 미리 받아 캐시를 채운다. 첫 사용자가 기다리지 않게 하려는
  # 것뿐이라 실패해도 기동은 진행된다(로그에만 남는다).
  models_prefetch_on_start: true

prompts:
  # 번역 지시. {source_lang} {target_lang} {style} 이 치환된다.
  system: |
    You are a professional interpreter. Translate the user's message from
    {source_lang} to {target_lang}.

    Rules:
    - Output ONLY the translation. No explanations, no notes, no quotation marks.
    - Preserve the speaker's tone, register, and intent.
    - Keep proper nouns and technical terms consistent with the glossary if given.
    - If the input is already in {target_lang}, return it unchanged.
    - Style: {style}
  styles:
    literal: "Translate closely to the original wording."
    natural: "Translate so it sounds natural to a native speaker."

  # `lang_learn` 모듈의 프롬프트. `prompts:` 는 core (app/core/llm.py 의 Translator)가
  # 이미 쓰는 준-core 섹션이라(moduleapi.py 의 "core 가 쓰는 섹션은 모듈도 읽어도
  # 된다") 여기에 얹는다 — 모듈 전용 최상위 섹션(`lang_learn:`, 아래)과는 별개로,
  # 다른 모듈도 나중에 프롬프트가 필요해지면 같은 자리에 자기 하위 키를 더할 수 있다.
  # 세 호출 모두 **JSON 하나만** 답하도록 강제한다 — 문장 사이에 설명이 섞이면
  # 파싱이 깨지고, 그 실패를 세션 하나가 통째로 죽는 것으로 처리하기 때문이다
  # (app/modules/lang_learn/llm.py 의 `_ask_json`).
  lang_learn:
    problem_system: |
      You are a foreign language tutor. The learner's target language is
      {target_lang}. Their current level is {level} (beginner/intermediate/advanced).
      Generate ONE practice problem of type "{answer_type}".

      - If the type is "repeat": produce a single natural sentence in
        {target_lang} for the learner to listen to and repeat aloud. Keep it at
        the given level (short and simple for beginner, longer and more complex
        for advanced).
      - If the type is "compose": describe a short situation or meaning IN
        {learner_lang} (the learner's own language) and ask the learner to say
        it in {target_lang}. Do not give away the exact target-language sentence.

      Avoid repeating these recent topics: {recent_topics}

      Respond with ONLY a JSON object, no other text, in this exact shape:
      {{"text": "<the sentence (repeat) or the situation prompt (compose)>"}}
    evaluate_system: |
      You are a foreign language tutor grading one answer. Target language:
      {target_lang}. Learner level: {level}. Problem type: "{answer_type}".

      Problem given to the learner:
      {problem_text}

      Learner's answer (transcribed if spoken):
      {answer_text}

      Score the answer from 0 (completely wrong/unintelligible) to 100
      (perfect). For "repeat" problems, judge how closely the learner
      reproduced the sentence. For "compose" problems, judge whether the
      meaning is conveyed correctly in {target_lang}, allowing for reasonable
      grammatical variation. Write one short, encouraging comment in
      {learner_lang}.

      Respond with ONLY a JSON object, no other text, in this exact shape:
      {{"score": <integer 0-100>, "comment": "<short comment in {learner_lang}>"}}
    summary_system: |
      You are a foreign language tutor. The learner just finished a practice
      session in {target_lang} at level {level}. Here are all the problems,
      their answers and their scores:

      {transcript}

      Write one short overall comment in {learner_lang} (encouraging, and
      naming one concrete thing to work on), and an overall score from 0 to
      100 for the whole session.

      Respond with ONLY a JSON object, no other text, in this exact shape:
      {{"score": <integer 0-100>, "comment": "<short overall comment in {learner_lang}>"}}

audio:
  # STT 엔진에 보낼 입력 규격. WS 스트림의 바이너리 프레임도 이 값을 따른다
  # (클라이언트가 다른 값을 선언하면 조용히 리샘플링하지 않고 오류로 알린다).
  stt_sample_rate: 16000
  stt_channels: 1
  # TTS 결과를 클라이언트에 돌려줄 기본 포맷 (wav|mp3|opus|flac|pcm — 엔진이 지원하는 범위)
  tts_response_format: wav
  tts_speed: 1.0
  # json  = 메타데이터 + base64 오디오 (수신자가 여럿이어도 한 번에 받는다)
  # binary= 오디오 바이트만 (수신자가 하나일 때. curl 로 확인하기 편하다)
  response_mode: json

  # --- 업로드 오디오 디코딩 ---
  # PTT 로 올라온 파일(webm/opus, mp3, m4a, wav …)을 PCM 으로 푸는 외부 도구.
  # audio_filter 가 켜져 있을 때만 쓰인다 — 꺼져 있으면 업로드 바이트는 손대지 않고
  # 그대로 STT 엔진으로 간다. 이미지에 ffmpeg 이 들어 있다.
  decoder: ffmpeg
  # 디코딩을 기다리는 시간(초). 넘기면 죽이고 원본을 그대로 보낸다(번역은 계속된다).
  decoder_timeout_s: 20
  # 서버가 직접 만든 PCM 을 STT 엔진에 넘길 때 쓰는 파일 이름과 MIME.
  # 게이트가 오디오를 손댄 경우 그 결과를 이 이름의 WAV 로 다시 감싸 보낸다.
  pcm_filename: audio.wav
  pcm_content_type: audio/wav

limits:
  max_input_chars: 5000
  max_audio_seconds: 600

# ---------------------------------------------------------------------------
# 기능 모듈의 설정 규약
# ---------------------------------------------------------------------------
#
# 오케스트레이터는 기능을 폴더 하나씩(`app/modules/<이름>/`) 붙인다.
# 음성 번역이 첫 번째이고, 앞으로 문서 음성 변환·외국어 학습·음성 대화가 붙는다.
#
#   ★ 모듈은 자기 이름의 **최상위 섹션 하나**를 갖는다. 다른 모듈의 섹션을 읽지 않는다.
#
#       tutor:                # app/modules/tutor/ 의 것
#         levels: [beginner, intermediate]
#
#   공용 섹션(server, auth, session, audio, engines, speaker_id, vad, turn,
#   audio_filter, llm, prompts, limits, diagnostics …)은 core 의 것이고
#   어느 모듈이든 읽어도 된다. 쓰는 쪽은 어디에도 없다.
#
#   모듈은 자기 섹션을 `/v1/config` 응답에 실을 수 있다. 그래야 그 모듈의
#   클라이언트 UI 도 서버 응답만 보고 그려진다 — 화면에 상수를 두지 않기 위해서다.
#   계약은 `orchestrator/app/core/moduleapi.py` 를 볼 것.
#
# 아래 `stream:` 은 번역 모듈이 WebSocket 엔드포인트를 열 때 쓰는 값들이다.
# (역사적인 이유로 이름이 모듈명과 다르다. 새 모듈은 위 규약대로 자기 이름을 쓸 것)

# ---------------------------------------------------------------------------
# 실시간 스트림 (WebSocket) — 번역 모듈
# ---------------------------------------------------------------------------

stream:
  # WS 엔드포인트 경로. 데코레이터가 기동 시점에 읽으므로 바꾸면 재기동이 필요하다.
  path: /v1/stream
  # 바이너리 프레임의 내용. 클라이언트가 /v1/config 로 이 값을 보고 맞춘다.
  input_format: pcm16
  # 클라이언트에 권장하는 전송 프레임 길이. 짧으면 반응이 빠른 대신 메시지 수가 늘고,
  # 길면 그 반대다. VAD 는 이 값과 무관하게 자기 frame_ms 로 다시 자르므로
  # 정확히 지키지 않아도 동작한다.
  client_frame_ms: 20
  # 접속 후 config 메시지를 기다리는 시간(초). 넘기면 끊는다.
  config_timeout_s: 15
  # 세그먼트를 STT 에 넘길 때 쓸 파일 이름과 MIME. WAV 컨테이너로 감싸 보낸다.
  segment_filename: segment.wav
  segment_content_type: audio/wav
  # 인증 실패 시 닫는 코드. 1008 = policy violation (RFC 6455)
  unauthorized_close_code: 1008

vad:
  # app/core/adapters/vad/ 에 등록된 구현 이름. 새 백엔드는 파일을 하나 넣고 여기서 고른다.
  # energy 는 의존성이 numpy 뿐이라 CPU 를 운영 서비스와 나눠 쓰는 환경에 적합하다.
  # silero(torch)·webrtc(C 확장)를 붙이면 판정이 정확해지는 대신 무거워진다.
  backend: energy

  # --- 판정 프레임 ---
  # RMS 를 재는 단위. 짧으면 반응이 빠르지만 잡음에 흔들리고, 길면 안정적인 대신
  # 발화 시작/끝 판정이 그만큼 늦다. 20~30ms 가 무난하다.
  frame_ms: 20

  # --- 임계값 ---
  # 유성으로 볼 최소 RMS (0.0~1.0, int16 풀스케일 기준).
  # 낮추면 작은 목소리도 잡지만 잡음도 같이 잡힌다. 조용한 방 0.005, 시끄러우면 0.02 정도.
  threshold: 0.010
  # 무음 구간의 잡음 바닥을 추적해 상대 임계값을 함께 볼 것인가.
  # 마이크 게인과 주변 소음이 환경마다 다르므로 고정 임계값만으로는 부족하다.
  adaptive: true
  # 잡음 바닥 대비 몇 dB 위를 발화로 볼 것인가. 크면 둔감(놓침), 작으면 예민(오검출).
  noise_margin_db: 12
  # 잡음 바닥 EMA 계수. 1 에 가까울수록 천천히 따라간다.
  # 너무 빠르면(0.9) 말 사이 짧은 휴지에도 바닥이 올라가 뒷부분을 놓친다.
  noise_decay: 0.995

  # --- 시작/끝 판정 ---
  # 발화로 인정하기 위해 유성 프레임이 연속돼야 하는 길이. 클릭음 한 방을 거른다.
  start_ms: 60
  # 발화 끝으로 볼 무음 길이. **지연과 오검출의 핵심 트레이드오프다.**
  # 300ms 면 빠르지만 말 중간 휴지에서 끊기고, 800ms 면 안전하지만 그만큼 늦게 시작한다.
  silence_ms: 600
  # 이보다 짧은 발화는 버린다(기침, 문 닫는 소리, 마이크 툭). 이벤트는 그대로 나가고
  # 파이프라인만 돌지 않는다. 크게 잡으면 짧은 대답("네", "yes")까지 사라진다.
  min_speech_ms: 250

  # --- 구간 다듬기 ---
  # 발화 시작 앞쪽을 이만큼 함께 담는다. 임계값을 넘기 전의 첫 음절이 잘리지 않게 한다.
  # 너무 크면 앞 잡음까지 딸려 들어간다.
  pre_roll_ms: 300
  # 발화 끝에 남길 무음. 한국어 종결어미는 끝이 약해져 에너지가 먼저 떨어지므로
  # 조금 남겨야 어미가 살아난다. 나머지 무음은 버려지고, 그만큼 인식 시간이 준다.
  post_roll_ms: 200
  # 소리가 계속 나는 환경에서 한 세그먼트가 무한정 길어지지 않게 강제로 끊는 길이.
  # 0 이면 강제 확정을 하지 않는다.
  max_speech_ms: 20000

audio_filter:
  # 세그먼트 **안쪽**을 손보는 층. VAD 가 경계를 정하고, 이쪽이 그 안을 다듬는다.
  # PTT(HTTP 업로드)와 핸즈프리(WS) 두 경로에 같은 구현이 걸린다.
  #
  # 끄면 두 경로 모두 오디오를 손대지 않고 그대로 STT 로 보낸다 — 업로드 파일은
  # 디코딩조차 하지 않는다. 즉 게이트를 끈 상태는 이 기능이 없던 때와 완전히 같다.
  #
  # 기본값이 켜짐인 이유: 옆에서 TV 가 나오는 환경에서 인식이 쓸 수 없을 만큼
  # 나빠지는 문제가 실측으로 확인됐고, 이 게이트로 해결되는 것도 실측으로 확인됐다.
  # 조용한 환경의 깨끗한 음성에는 영향이 없다(잘라낼 것이 없어 그대로 통과한다).
  enabled: true

  # app/core/adapters/audio_filter/ 에 등록된 구현 이름.
  # 새 필터는 그 폴더에 파일을 하나 넣고 여기서 이름으로 고른다.
  implementation: dominant_gate

  # --- dominant_gate 의 값들 ---
  # 세그먼트 안에서 "가장 큰 소리"를 기준(ref)으로 잡고, 그보다 drop_db 이상 낮은
  # 프레임을 0 으로 만든다. 사용자가 마이크에 가까워 우세하고, TV 만 나오는 구간은
  # 그보다 낮아 잘려나간다는 것이 이 방식이 서는 전제다.

  # RMS 를 재는 단위(ms). VAD 의 frame_ms 와 같은 성질의 값이지만 별개로 둔다 —
  # 경계 판정과 내부 다듬기는 필요한 시간 해상도가 다를 수 있다.
  frame_ms: 20

  # 우세 레벨보다 몇 dB 아래를 무음으로 볼 것인가. **가장 예민한 값이다.**
  #   4~5dB  발화까지 갉아먹어 오인식이 늘었다 ("저희는", "배이는")
  #   6dB    실측 최적 — TV 구간이 사라지고 발화는 온전했다
  #   7~8dB  TV 가 다시 섞여 들어왔다
  # 배경음이 사용자와 비슷하게 크면(스피커폰 등) 어떤 값도 잘 듣지 않는다.
  # 그때는 enabled: false 가 낫다.
  drop_db: 6

  # 유지 구간이 끊긴 뒤 계속 살려둘 길이(ms). 음절 사이의 짧은 저에너지 구간과
  # 힘이 빠지는 한국어 종결어미를 지키기 위한 것이다.
  #   100·180·250ms  실측에서 모두 같은(정상) 결과
  #   400ms          ★ 오히려 나빠졌다 — 유지 구간이 뒤따르는 TV 소리까지 이어붙였다
  # "안전하게 크게" 잡으면 되는 값이 아니다. 키울수록 게이트가 무력해진다.
  hold_ms: 200

  # 우세 레벨을 정할 때 표본으로 삼을 상위 프레임의 비율(%).
  # 상위 5% 프레임의 dB 중앙값이 기준이 된다. 최댓값 하나를 쓰지 않는 이유는
  # 마이크를 툭 친 한 프레임이 기준을 끌어올려 발화 전체를 잘라버리기 때문이다.
  # 작게 잡으면(1%) 그 사고에 다시 가까워지고, 크게 잡으면(20%) 기준이 낮아져
  # 배경음이 통과하기 시작한다.
  reference_top_percent: 5

  # 이보다 짧은 입력은 손대지 않는다(ms). 우세 레벨을 정할 표본이 없기 때문이다.
  # 크게 잡으면 짧은 대답("네", "yes")이 게이트를 통째로 건너뛴다.
  min_duration_ms: 300

speaker_id:
  # 어느 화자 식별 구현을 쓸지는 **세션 프로필**이 정한다 (profiles.yaml 의 speaker_id).
  # 이 섹션은 그중 `voice_print` 가 쓰는 값들이다. 다른 구현에는 영향이 없다.
  #
  # ★ 프라이버시 — voice_print 는 목소리에서 뽑은 임베딩을 다룬다. 이것은 음성을
  #   복원할 수는 없지만 같은 사람을 다시 알아보는 데 충분한, 생체정보에 준하는
  #   개인정보다. 명시적으로 등록한 것만 파일에 남고(store_path), 대화 중 저절로
  #   배운 것은 메모리에만 두었다가 세션과 함께 버린다.

  # app/core/adapters/speaker_policy/ 에 등록된 정책 이름.
  #   strict          등록된 목소리만 받는다. 미달이면 버린다.
  #                   회의실처럼 참여자가 고정된 자리에 맞는다. 등록된 화자가 하나도
  #                   없으면 아무것도 통역되지 않는다 — 그것이 이 정책의 정의다.
  #   enrolled_first  등록된 사람은 식별하고, 등록 안 된 목소리는 버리지 않고
  #                   남은 참여자 자리에 넣는다. 자리가 모두 차면 그때부터 거부한다.
  #   off             화자 식별에 관여하지 않는다. 등록 기능이 없던 때와 완전히 같고,
  #                   화자 임베딩 엔진도 호출되지 않는다.
  #
  # 기본값이 enrolled_first 인 이유: 통역기는 **처음 만난 사람**과 대화하려고 쓴다.
  # 상대방은 등록돼 있을 리 없으므로 strict 를 기본으로 두면 핵심 용도가 막힌다.
  policy: enrolled_first

  # 같은 사람으로 볼 코사인 유사도 하한. **가장 예민한 값이다.**
  #   합성음 실측: 같은 화자 0.72~0.80 / 다른 화자 0.20~0.42 → 0.5 가 가운데
  # ★ 이 숫자는 합성음(TTS 보이스) 기준이다. 실제 마이크 음성은 잡음·거리·마이크
  #   특성 때문에 같은 화자끼리도 유사도가 내려가고 분포가 넓어진다. 즉 실사용에서는
  #   여유가 이보다 좁다고 보아야 한다.
  #   올리면  남을 나로 오인하는 일이 줄고, 나를 못 알아보는 일이 는다
  #   내리면  그 반대 — 배경 화자가 통과하기 시작한다
  # metrics 의 speaker_similarity 를 모아 실사용 분포를 본 뒤 조정할 것.
  threshold: 0.5

  # 명시적으로 등록된 목소리를 담는 파일 (컨테이너 안 경로).
  # config/ 는 읽기전용으로 마운트되므로 쓰기 가능한 볼륨을 따로 쓴다
  # (docker-compose.yml 이 호스트의 ../data 를 여기에 붙인다).
  # ★ 평문 JSON 이다. 파일 권한이 곧 이 데이터의 보호 수단이다.
  store_path: /data/voiceprints.json

  # 등록(POST /v1/speakers/enroll)에 요구할 최소 오디오 개수.
  # 1이면 한 마디로도 등록된다(간편하지만 임베딩이 그 한 번의 발성에 좌우된다).
  # 2~3으로 올리면 평균이 안정되는 대신 등록 절차가 번거로워진다.
  min_enroll_files: 1

  auto_enroll:
    # 대화 중에 목소리를 저절로 배운다. 등록 화면 없이 대화만 시작하면 되게 하는 것이 목적이다.
    # 세션에서 처음 나온 목소리를 첫 참여자에, 임계값 미만으로 다른 목소리를 다음
    # 참여자에 배정한다. **배운 것은 메모리에만 있고 세션이 끝나면 사라진다.**
    #
    # WS 세션에만 해당한다. HTTP 배치는 요청마다 독립이라 "세션에서 처음 나온 목소리"가
    # 성립하지 않고, 그렇다고 파일에 남기면 동의 없이 목소리를 저장하는 셈이 된다.
    # 그 경로에서는 자동 등록을 하지 않고 metrics 에 speaker_auto_enroll: unavailable 로 남긴다.
    enabled: true

    # 이보다 짧은 발화로는 배우지 않는다(초). 짧은 발화는 임베딩이 불안정해서
    # 잘못 배우면 그 세션 내내 오식별이 이어진다. 엔진 자체도 1초 미만은 거절한다.
    # 크게 잡으면 짧은 첫 마디("네", "hello")로는 학습이 시작되지 않는다.
    min_utterance_s: 1.5

    # 배운 목소리의 평균에 반영할 발화 수 — "몇 개를 모아야 그 목소리가 확정되는가".
    # 이 개수를 채울 때까지는 새 발화가 들어올 때마다 평균을 갱신하고, 채운 뒤에는
    # 갱신하지 않는다. 계속 갱신하면 잘못 배정된 발화가 섞여 목소리가 서서히
    # 다른 사람 쪽으로 끌려간다. 크게 잡으면 안정되는 대신 그 위험이 오래 남는다.
    utterances: 3

diagnostics:
  # VAD 가 확정한 세그먼트를 WAV 로 저장한다. STT 에 실제로 들어간 오디오를 직접
  # 들어보기 위한 것이다 — 앞 음절이 잘렸는지, 종결어미가 날아갔는지는 지표로는
  # 알 수 없고 귀로만 알 수 있다. 위 vad: 값들을 조정할 때 근거가 된다.
  #
  # ★ 프라이버시 — 켜면 사용자 음성이 암호화 없이 평문 WAV 로 디스크에 남는다.
  #   같은 폴더의 사이드카 JSON 에는 인식된 원문과 번역문까지 들어간다.
  #   운영에서는 반드시 꺼둘 것. 문제를 재현하는 동안만 켜고, 끝나면 폴더를 비운다.
  save_segments: false
  # 저장 위치(컨테이너 안 경로). docker-compose.yml 이 호스트의 ../diagnostics 를
  # 여기에 붙인다. 저장이 실패해도(권한·용량) 번역 파이프라인은 멈추지 않는다 —
  # 로그에 경고만 남는다.
  segment_dir: /diagnostics
  # 최근 몇 개를 남길 것인가. 넘으면 오래된 것부터 WAV·JSON 을 함께 지운다.
  # 0 이면 지우지 않는다 — 오래 켜두면 디스크가 찬다.
  keep_last: 50
  # 파일 이름에 넣을 인식 텍스트의 최대 글자 수. 어느 파일이 어느 발화인지
  # 폴더 목록만 보고 알기 위한 것이다. 0 이면 텍스트를 넣지 않는다.
  filename_text_chars: 24
  # 상류(엔진·LLM 프로바이더)가 돌려준 오류 **본문**을 클라이언트 응답에도 실을지.
  # 본문은 이 값과 무관하게 언제나 서버 로그에 남는다 — 끄더라도 디버깅 능력은
  # 그대로다. 이 스위치가 정하는 것은 "API 를 부르는 쪽에도 보여줄 것인가"뿐이다.
  #
  # ★ 켜면 우리 것이 아닌 정보가 새어 나간다. 실제로 프로바이더 본문에는 조직
  #   식별자(org_...), 모델명, 요금제 티어, 레이트리밋 한도가 들어 있었다.
  #   API 키를 가진 클라이언트라면 누구나 보게 된다. 문제를 재현하는 동안만 켜고,
  #   끝나면 되돌릴 것. 규칙은 app/core/upstream.py 에 한 곳으로 모여 있다.
  expose_upstream_errors: false

turn:
  # 정책 이름은 세션 프로필의 turn_policy 로 정해진다(없으면 session.default_turn_policy).
  # 등록된 구현은 /v1/config 의 turn.available 에 나온다.
  #
  # 서버는 스피커를 볼 수 없으므로 보낸 오디오 길이로 재생 구간을 추정한다.
  # 이 값은 그 추정에 더하는 여유(초)다 — 네트워크 지연과 재생 시작 지연을 덮는다.
  # 크게 잡으면 안전하지만 다음 발화를 받기까지 그만큼 기다린다.
  # 클라이언트가 control/playback 을 보내면 추정 대신 그 값이 쓰인다.
  playback_grace_s: 0.5

client:
  # 웹 클라이언트의 입력 방식 선택지. 목록도 순서도 기본값도 여기서 온다.
  #   ptt        누르고 있는 동안 녹음해 HTTP 로 업로드 (기존 동작)
  #   handsfree  마이크를 계속 WS 로 흘려보내고 서버 VAD 가 끊는다
  # 클라이언트가 모르는 이름은 무시한다. 구현이 없는 방식을 목록에서 빼면 사라진다.
  input_modes: [ptt, handsfree]
  default_input_mode: ptt

users:
  # 사용자(이름/별칭 + PIN) 저장소. DESIGN.md §15 — 1단계는 테넌트를 만들지 않고
  # 서버 하나 안에서 사람을 가르는 최소한의 계정 모델만 둔다.
  #
  # 화자 등록 저장소(speaker_id.store_path)와 같은 볼륨(../data)에 두되 파일은
  # 나눈다 — 하나가 깨져도 다른 하나는 멀쩡해야 한다.
  store_path: /data/users.json

  # PIN 최소 길이. 짧을수록 외우기 쉽지만 무차별대입에 약하다. 개인/소수 사용자
  # 서버라 4자리도 쓸 수 있게 낮게 잡는다 — 은행 앱이 아니라 "이름표" 수준이다.
  pin_min_length: 4

  # PBKDF2-SHA256 반복 횟수. 저장된 해시 문자열 자체에도 이 값이 실리므로
  # (app/core/users.py 의 `_hash_pin`) 여기를 올려도 예전에 만든 계정은 계속 그때
  # 반복 횟수로 검증된다 — 한꺼번에 재해시하지 않아도 된다.
  pbkdf2_iterations: 260000

voice_samples:
  # STT 개인화용 음성 샘플 저장소 (app/core/voice_samples.py). PLAN_LANG_LEARN.md
  # 서버 작업 2번 — 사용자가 말한 발화 일부를 모아뒀다가 나중에(이 범위 밖) 그
  # 사람 목소리로 STT 를 재학습하는 데 쓴다. 여기서는 저장 정책만 정의한다 —
  # 언제 저장할지(어느 흐름에서 `save()` 를 부를지)는 이 설정이 정하지 않는다.
  #
  # ★ 프라이버시 — voiceprints.py 의 화자 임베딩보다 더 민감하다. 임베딩은 벡터라
  #   원래 말을 복원할 수 없지만, 여기 있는 것은 **원본 오디오 그 자체**다 —
  #   목소리(생체정보)뿐 아니라 말한 내용까지 담고 있다. 상세 취급 방침은
  #   app/core/voice_samples.py 상단 주석을 볼 것.

  # 메타데이터(전사문 없음, 오디오 없음) 저장 파일. 다른 저장소와 같은 쓰기 가능
  # 볼륨(../data)을 쓰되 파일은 나눈다 — 하나가 깨져도 다른 것은 멀쩡해야 한다.
  store_path: /data/voice_samples.json

  # 오디오 바이트 자체가 사용자별 하위 폴더로 쌓이는 디렉터리(컨테이너 안 경로).
  # 메타 파일과 분리하는 이유: 메타 파일을 열어보는 사람(운영자가 저장 현황을
  # 확인할 때 등)이 매번 바이너리를 마주치지 않게, 그리고 "이 사용자 것을 전부
  # 지운다"를 폴더 삭제 수준으로 단순하게 하기 위해서다.
  audio_dir: /data/voice_samples

  # 사용자 1명이 가질 수 있는 최대 샘플 개수. 넘으면 저장할 때마다 가장 오래된
  # 것부터(메타+오디오 함께) 지운다. 0 이면 개수로 제한하지 않는다(기간 제한만 적용).
  # 크게 잡으면 재학습에 쓸 표본이 늘지만 디스크·개인정보 노출 범위도 늘어난다.
  max_per_user: 200

  # 샘플을 이 기간(일)보다 오래 들고 있지 않는다. 저장할 때마다 정리한다.
  # 0 이면 기간으로 제한하지 않는다(개수 제한만 적용). 재학습에는 최근 목소리가
  # 더 유용하고, 오래된 원본 음성을 무기한 들고 있는 것은 그 자체로 위험이다.
  max_age_days: 90

  # 샘플 하나의 최대 길이(초). 이보다 긴 오디오로 저장을 요청하면 거부한다
  # (`voice_samples.too_long`). 이 저장소는 "짧은 발화 일부"를 모으는 용도라
  # 통짜 세션 전체를 저장하는 것은 목적에서 벗어난다. 0 이면 제한하지 않는다.
  max_sample_duration_s: 30

# ---------------------------------------------------------------------------
# STT 개인화 — 데이터 수집 (app/modules/stt_training) — DESIGN.md §16 0단계
# ---------------------------------------------------------------------------
#
# 방법 A(파인튜닝)·방법 B(LLM 문맥 개인화) 둘 다의 재료를 모으는 단계다. 이 모듈
# 자체는 그 재료를 어떻게 쓰는지 모른다 — 저장까지만 한다.
#
#   낭독 교정 — 서버가 미리 준비한 문장(아래 sentence_bank)을 하나씩 내주고,
#     사용자가 그대로 읽은 음성을 (문장 텍스트, 음성) 확정쌍으로 저장한다.
#   정오 판정 — 사용자가 자유롭게 말한 음성을 STT 로 돌려 인식 결과를 보여주고,
#     사용자가 맞다/틀리다 판정한다. 판정 전까지는 임시 저장(pending) 상태다.
stt_training:
  # 문장 은행 — 언어별. id 는 전체(모든 언어 통틀어) 고유해야 한다 — read_sample
  # 업로드가 prompt_id 하나만으로 어느 언어·어느 문장인지 찾아야 하기 때문이다
  # (문장 텍스트가 아니라 id 로 추적해야, 나중에 문장을 다듬어도 사용자의 "이미
  # 읽음" 이력이 깨지지 않는다). 문장은 짧고, 발음이 겹치지 않게 다양성을 주려고
  # 골랐다(받침·이중모음·외래어·억양이 갈리는 문장 위주) — 정교한 음성학적 설계는
  # 아니고 "그럭저럭 다양하다" 수준의 1차 목록이다. 언어를 늘리려면 이 아래에
  # 키를 추가하면 된다(하드코딩된 언어 목록이 코드에는 없다).
  sentence_bank:
    ko:
      - {id: ko-01, text: "오늘 날씨가 정말 좋네요."}
      - {id: ko-02, text: "저는 매일 아침 커피를 마십니다."}
      - {id: ko-03, text: "그 책은 도서관에 반납했어요."}
      - {id: ko-04, text: "회의는 세 시에 시작합니다."}
      - {id: ko-05, text: "김치찌개가 정말 맛있었어요."}
      - {id: ko-06, text: "지하철역까지 걸어서 십 분 걸려요."}
      - {id: ko-07, text: "이 서류에 서명해 주시겠어요?"}
      - {id: ko-08, text: "내일은 휴일이라 회사에 안 가요."}
      - {id: ko-09, text: "물 한 잔만 주시겠어요?"}
      - {id: ko-10, text: "새로 산 노트북이 정말 가볍네요."}
      - {id: ko-11, text: "다음 주 화요일에 다시 연락드릴게요."}
      - {id: ko-12, text: "창문을 조금 열어도 될까요?"}
      - {id: ko-13, text: "이 길로 쭉 가면 시청이 나옵니다."}
      - {id: ko-14, text: "동생이 대학교에 합격했어요."}
      - {id: ko-15, text: "요즘 운동을 꾸준히 하고 있어요."}
    en:
      - {id: en-01, text: "The weather is really nice today."}
      - {id: en-02, text: "I drink coffee every morning."}
      - {id: en-03, text: "I returned that book to the library."}
      - {id: en-04, text: "The meeting starts at three o'clock."}
      - {id: en-05, text: "This kimchi stew tastes amazing."}
      - {id: en-06, text: "It takes ten minutes to walk to the station."}
      - {id: en-07, text: "Could you sign this document, please?"}
      - {id: en-08, text: "Tomorrow is a holiday, so I'm not going to work."}
      - {id: en-09, text: "Could I get a glass of water?"}
      - {id: en-10, text: "My new laptop is really lightweight."}
      - {id: en-11, text: "I'll get back to you next Tuesday."}
      - {id: en-12, text: "Would it be okay to open the window a little?"}
      - {id: en-13, text: "Go straight down this road and you'll reach city hall."}
      - {id: en-14, text: "My younger sibling got into university."}
      - {id: en-15, text: "I've been exercising regularly these days."}

  # `lang` 을 안 주는 요청(아래 next_prompt)이 기본으로 쓰는 언어.
  default_lang: ko

  # 목표 횟수 — 낭독 교정과 정오 판정은 서로 다른 활동이라 따로 센다.
  required_read_count: 10
  required_verify_count: 10

  # 낭독 교정 저장소(문장+음성 확정쌍). `core/voice_samples.py` 와 의도적으로
  # 다르다 — 거기는 사생활 보호로 전사문을 안 남기지만, 여기는 사용자가 이미
  # 화면에서 본 정해진 문장을 그대로 읽은 것이라 텍스트를 같이 저장하는 것 자체가
  # 목적이다(무엇을 재학습 재료로 쓸지는 이 모듈 밖의 일이다).
  read_store_path: /data/stt_training_read.json
  read_audio_dir: /data/stt_training_read

  # 정오 판정 저장소(음성+STT 인식결과+판정+교정텍스트). verify 요청 시 판정 전
  # 상태(pending)로 임시 저장되고, verdict 요청이 오면 확정된다.
  verify_store_path: /data/stt_training_verify.json
  verify_audio_dir: /data/stt_training_verify

  # 판정 안 된 verify 임시 샘플의 만료 기간(시간). 사용자가 인식 결과를 보고도
  # 판정을 끝내지 않고 이탈하는 경우, 누구인지도 불분명한 음성이 무기한 쌓이는
  # 것을 막는다. 저장할 때마다(voice_samples.py 와 같은 방식으로) 정리한다.
  verify_pending_ttl_hours: 24

  # STT/TTS 호출에 쓸 라우팅 모드. 문제 하나·답변 하나 단위의 왕복이므로 배치를 쓴다
  # (lang_learn 모듈과 같은 이유).
  stt_mode: batch

messages:
  # 오류 문구 카탈로그는 config/messages/<locale>.yaml 이다. 그 위치는 설정보다 먼저
  # 필요하므로(설정을 못 읽은 오류에도 문구가 있어야 한다) 코드가 안다 — 여기 없다.
  #
  # 코드가 실행 시점에 조립되는 이름공간. 검증 스크립트가 "아무도 안 쓰는 죽은 키"로
  # 보고하지 않게 하려는 것뿐이고, 서버 동작에는 쓰이지 않는다.
  #   http.*   프레임워크가 만든 응답에 붙는 http.<상태코드>
  dynamic_prefixes: ["http."]

# ---------------------------------------------------------------------------
# 외국어 학습 모듈 (app/modules/lang_learn) — DESIGN.md §15 / PLAN_LANG_LEARN.md
# ---------------------------------------------------------------------------

lang_learn:
  # 사용자별로 저장되는 값들의 기본치 (아직 아무도 설정을 저장하지 않은 사용자).
  # PUT 은 부분 갱신을 허용한다(app/modules/lang_learn/routes.py 주석 참고) — 저장된
  # 값과 여기 기본값을 키 단위로 합친 것이 GET 의 응답이다.
  defaults:
    schedule: []                  # [{time: "HH:MM", count: N}, ...] 빈 배열 = 스케줄 없음
    target_lang: en
    level_mode: adaptive          # adaptive | manual
    manual_level: null
    feedback_mode: both           # immediate | summary | both
    show_text_for_repeat: false

  # 사용자별 설정 저장 파일. 다른 저장소와 같은 쓰기 가능 볼륨(../data)을 쓰되
  # 파일은 나눈다 — 하나가 깨져도 다른 것은 멀쩡해야 한다(users.py/voiceprints.py
  # 와 같은 규칙).
  settings_store_path: /data/lang_learn_settings.json

  # 세션 이력(문제·답변·평가·총평) 저장 파일. 사용자당 무한히 쌓이지 않도록
  # 아래 history_max_per_user 로 오래된 것부터 정리한다.
  history_store_path: /data/lang_learn_history.json
  history_max_per_user: 200

  # 난이도 단계. 순서가 등급이다(낮은 인덱스가 쉬움) — 적응형 조정은 이 목록에서
  # 한 단계씩 옮긴다. manual_level 도 이 목록의 값 중 하나여야 한다.
  levels: [beginner, intermediate, advanced]
  # level_mode=adaptive 인 신규 사용자(이력 없음)가 시작하는 단계.
  default_level: beginner

  # 적응형 난이도 조정 — 최근 세션들의 평균 내부 점수로 한 단계씩 옮긴다.
  # 공식은 의도적으로 단순하다(세 세션 이동평균 + 임계값 두 개). 정교한 커브가
  # 필요해지면 그때 바꾼다 — 지금은 "몇 번 잘하면 올리고 몇 번 못하면 내린다"
  # 정도만 있으면 충분하다는 판단이다.
  adaptive:
    lookback_sessions: 3          # 최근 몇 세션의 평균을 볼지
    raise_threshold: 80           # 평균이 이 이상이면 한 단계 올린다
    lower_threshold: 40           # 평균이 이 이하면 한 단계 내린다

  # 내부 점수(0~100, 이력에만 남는다) → 프로토콜에 나가는 등급.
  # 점수는 절대 클라이언트로 나가지 않는다(DESIGN.md §15) — 등급만 나간다.
  grade_bands:
    상: 80   # score >= 80
    중: 50   # score >= 50, else 하

  # 세션당 문제 유형이 오가는 순서. LLM 에게 유형까지 고르게 하면 답을 파싱해야
  # 할 필드가 하나 늘고 실패 모드도 늘어난다 — 유형은 서버가 정하고 LLM 은 그
  # 유형의 문제만 만들게 하는 것이 더 단단하다. 목록을 다 쓰면 반복한다.
  answer_type_pattern: [repeat, compose]

  # STT 개인화 샘플 채택 — 학습 세션 중 사용자가 보낸 음성 답변 중 이 비율만
  # `voice_samples` 저장소에 남긴다. 전부 저장하면(=1.0) 세션 하나가 다른 흐름
  # (번역 등)에서 모인 표본보다 압도적으로 많아져서 재학습 표본이 "학습 세션에서
  # 읽은 스크립트 말투"로 편향된다. 1/3 정도면 목소리 특징을 익히기에 충분하면서
  # 편향은 줄어든다는 판단 — 정교한 근거가 있는 값은 아니고, 운영하며 조정할
  # 여지를 설정으로 열어둔 것뿐이다.
  voice_sample_capture_rate: 0.34

  # STT/TTS 호출에 쓸 라우팅 모드(core.enginecall 의 mode). 실시간 스트림이 아니라
  # 문제 하나·답변 하나 단위의 왕복이므로 배치 라우팅을 쓴다.
  stt_mode: batch
  tts_mode: batch

  llm:
    provider: null   # null 이면 llm.default_provider
    model: null       # null 이면 그 프로바이더의 default_model

  stream:
    path: /v1/lang_learn/stream
    # 접속 후 start 메시지를 기다리는 시간(초). 넘기면 끊는다 (stream.config_timeout_s
    # 와 같은 규칙, 값은 이 모듈이 따로 갖는다 — 학습 세션은 사용자가 로그인 화면을
    # 거친 뒤 여는 것이라 더 여유를 줄 수 있다).
    start_timeout_s: 20
    answer_timeout_s: 120
    unauthorized_close_code: 1008
    default_count: 5
