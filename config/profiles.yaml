# 세션 프로필 — 단방향/양방향 같은 구성을 이름으로 고를 수 있게 묶어둔다.
#
# 여기 있는 키 이름(oneway, twoway)은 코드에 없다. 이름을 바꾸거나 프로필을 더 만들어도
# 코드는 그대로다. 클라이언트는 GET /v1/config 로 목록과 label 을 받아 UI 를 그린다.
#
# 참여자 하나 = (언어, 입력 받을지, 번역 결과를 누구에게 들려줄지)
#   {{source_lang}} / {{target_lang}} 는 세션이 넘긴 값으로 치환된다.
#
# 프로필이 요구하는 어댑터(speaker_id 등)가 등록돼 있지 않으면 그 프로필은
# 사용 불가로 표시되고, 강제로 열면 그 이유로 거부된다.

profiles:
  oneway:
    # label/description 은 로케일 맵이다. en 이 기본어이고, 없는 로케일은 en 으로 떨어진다.
    label:
      en: "One-way — one person speaks, the other listens"
      ko: "단방향 — 한 사람이 말하고 상대 언어로 출력"
    description:
      en: "For presentations, announcements, one-directional delivery"
      ko: "발표, 안내, 일방향 전달에 적합"
    participants:
      - { id: speaker,  lang: "{{source_lang}}", input: true,  output: [listener] }
      - { id: listener, lang: "{{target_lang}}", input: false, output: [] }
    speaker_id: manual
    turn_policy: half_duplex

  twoway:
    label:
      en: "Two-way — both people speak their own language"
      ko: "양방향 — 두 사람이 각자 언어로 대화"
    description:
      en: "Conversational interpreting. Requires speaker identification"
      ko: "대화형 통역. 화자 식별이 필요하다"
    participants:
      - { id: a, lang: "{{source_lang}}", input: true, output: [b] }
      - { id: b, lang: "{{target_lang}}", input: true, output: [a] }
    speaker_id: language_detect
    turn_policy: half_duplex

  twoway_voice:
    # 같은 양방향이지만 누가 말했는지를 **목소리**로 가린다.
    # 참여자 id 가 a / b 이므로 등록도 그 id 로 한다:
    #   curl -F speaker_id=a -F files=@my-voice.wav .../v1/speakers/enroll
    # 등록을 하지 않아도 열린다 — 기본 정책(enrolled_first)이 미등록 목소리를
    # 남은 참여자에게 배정하고, 자동 등록이 켜져 있으면 대화 중에 배운다.
    label:
      en: "Two-way (voice) — tells the speakers apart by their voice"
      ko: "양방향 (목소리) — 목소리로 발화자를 구분"
    description:
      en: "One device shared by two people. Enrolling a voice makes it exact"
      ko: "한 기기를 두 사람이 함께 쓸 때. 목소리를 등록해 두면 더 정확하다"
    participants:
      - { id: a, lang: "{{source_lang}}", input: true, output: [b] }
      - { id: b, lang: "{{target_lang}}", input: true, output: [a] }
    speaker_id: voice_print
    turn_policy: half_duplex
