# ---- 그 밖 ------------------------------------------------------------------
#
# `http.*` 는 프레임워크가 만든 응답(없는 경로, 허용되지 않은 메서드, 본문 검증)에
# 붙는다. 코드가 `http.<상태코드>` 로 조립되므로 여기에 상태코드를 추가하면
# 소스를 고치지 않고도 그 상태에 문구가 붙는다. 없는 상태는 http.error 로 떨어진다.
internal.error: "The request failed for an unexpected reason"
http.error: "The request failed ({status}): {detail}"
http.404: "There is no such endpoint: {method} {path}"
http.405: "{method} is not allowed on {path}"
http.422: "The request body is not valid — {summary}"
