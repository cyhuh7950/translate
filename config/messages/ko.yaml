# 오류 문구 카탈로그 — 한국어. **번역본이다.**
#
# 원본은 en.yaml 이고, 여기 없는 키는 en 으로 폴백한다. 그러므로 이 파일은
# 언제 비어 있어도 서버가 동작한다. 새 코드는 en.yaml 에 먼저 넣는다.
#
# 치환 이름(`{engine_id}` 등)은 en.yaml 과 같아야 한다. 이름을 바꾸면 그 문구만
# 진단 문자열로 떨어진다.

# ---- 인증 -------------------------------------------------------------------
