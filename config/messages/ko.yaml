audio.decode_failed: "{decoder} 가 {status_code} 로 종료했습니다: {reason}"
audio.decode_empty: "{decoder} 가 오디오 샘플을 하나도 내놓지 않았습니다"
text.too_long: "텍스트가 너무 깁니다 ({length} > {limit}자)"
request.stream_with_audio: >-
  stream 과 with_audio 는 함께 쓸 수 없습니다. 스트리밍 응답은 토큰만 흘려보내는
  본문이라 오디오를 실을 자리가 없습니다. 소리까지 흘려보내려면 WebSocket
  엔드포인트({path})를 쓰거나, 둘 중 하나를 빼 주세요

