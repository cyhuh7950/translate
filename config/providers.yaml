# LLM 프로바이더 — 번역을 담당한다.
#
# kind 는 어댑터 계열 이름이고 레지스트리에서 찾는다. OpenAI 호환이면 base_url 만 다르므로
# 새 프로바이더 추가는 이 파일에 항목 하나 추가로 끝난다. 코드 수정이 없다.
#
# api_key_env 가 가리키는 환경변수는 config/secrets.env 에서 주입한다.
# 키가 비어 있는 프로바이더는 GET /v1/config 응답에서 사용 불가로 표시된다.
#
# ── default_model 은 폴백이다 ────────────────────────────────────────────────
# 고를 수 있는 모델 목록은 여기 적지 않는다. `GET /v1/models` 가 프로바이더에 직접
# 물어본다 (캐시·타임아웃은 defaults.yaml 의 llm.models_* 에 있다). 여기 남은
# default_model 은 **조회가 실패했거나 클라이언트가 고르지 않았을 때** 쓸 하나다.
# 이것마저 비어 있으면 그 프로바이더를 고른 요청은 llm.no_model 로 거절된다.
#
# ── options: 프로바이더 고유 옵션 ────────────────────────────────────────────
# 항목에 `options:` 를 적으면 그 내용이 채팅 요청 본문에 그대로 실려 간다. 계열의
# 공통 규격이 아닌 값(추론 강도, 안전 설정 …)을 보내는 통로다. 사전 값은 한 겹
# 병합되므로 `generationConfig` 처럼 어댑터가 이미 만든 사전에 한 항목만 더할 수
# 있다. 이름을 코드가 알지 못하므로 새 옵션을 쓰려고 소스를 고칠 일이 없다.
#
# ★ 주의 — options 는 **프로바이더 단위**다. 한 프로바이더 안의 모델들이 같은 옵션을
#   받아들인다는 보장이 없다. 실제로 groq 의 `reasoning_effort: low` 는 gpt-oss 계열은
#   받지만 `qwen/qwen3.6-27b` 는 거절한다(400: "must be one of none or default").
#   즉 여기 옵션을 적으면 **그 옵션을 거절하는 모델은 고를 수 없게 된다.**
#   모델을 고를 수 있게 된 뒤로는 이 점이 눈에 띈다 — 특정 모델이 400 으로 거절되면
#   이 절을 먼저 의심할 것. 서버 로그의 [upstream] 줄에 상류 응답 본문이 그대로 남는다.
#   (모델별로 다르게 주려면 프로바이더 항목을 둘로 나누는 것이 지금 구조에서의 방법이다.)

providers:
  cerebras:
    label: "Cerebras"
    kind: openai_compatible
    base_url: https://api.cerebras.ai/v1
    api_key_env: LLM_KEY_CEREBRAS
    default_model: zai-glm-4.7   # CJK 번역 품질이 좋다
    # 첫 토큰이 매우 빠르다 — 실시간 모드에 유리
    fast: true

  groq:
    label: "Groq"
    kind: openai_compatible
    base_url: https://api.groq.com/openai/v1
    api_key_env: LLM_KEY_GROQ
    # 2026-08 실측으로 고른 값. 이전에 쓰던 llama-3.3-70b-versatile 은 Groq 이 없애서
    # 404(model_not_found)로 앱이 멈췄다 — **모델 이름을 설정에 박아두면 프로바이더가
    # 목록을 바꿀 때마다 이렇게 멈춘다.** 목록을 런타임에 조회하도록 고치는 것이 맞다.
    #
    # 고른 근거 (한국어→영어, 문장 3개 평균):
    #   gpt-oss-120b  0.36s  가장 자연스럽다 ("I'll get back in touch with you tomorrow")
    #   gpt-oss-20b   0.49s  정확하지만 조금 딱딱하고, 레이트리밋에 더 빨리 걸렸다
    #   qwen3.6-27b          사고 과정을 그대로 출력해 쓸 수 없다
    #
    # gpt-oss 는 추론 모델이라 완성 토큰의 절반 이상이 사고 토큰이다. llm.max_output_tokens
    # 를 작게 잡으면 사고만 하다 답이 잘려 **빈 번역문**이 나온다(2048 이면 넉넉하다).
    default_model: openai/gpt-oss-120b
    fast: true
    # 이 프로바이더에만 실려 가는 값들. 어댑터는 이름을 모르고 그대로 넘긴다.
    options:
      # gpt-oss 는 추론 모델이라 완성 토큰의 절반 이상이 사고 토큰이다. 통역에는
      # 긴 사고가 필요 없어서 강도를 낮춘다. 2026-08 실측(같은 문장 3개 평균):
      #   기본  0.496s · 완성 토큰 72
      #   low   0.390s · 완성 토큰 28   ← 번역문 품질은 그대로였다
      # 사고 토큰이 줄면 max_output_tokens 에 걸려 답이 잘릴 위험도 함께 줄어든다.
      reasoning_effort: low

  mistral:
    label: "Mistral"
    kind: openai_compatible
    base_url: https://api.mistral.ai/v1
    api_key_env: LLM_KEY_MISTRAL
    default_model: ""

  openrouter:
    label: "OpenRouter"
    kind: openai_compatible
    base_url: https://openrouter.ai/api/v1
    api_key_env: LLM_KEY_OPENROUTER
    default_model: ""

  upstage:
    label: "Upstage (Solar)"
    kind: openai_compatible
    base_url: https://api.upstage.ai/v1
    api_key_env: LLM_KEY_UPSTAGE
    default_model: solar-pro4   # 한국어 특화(Upstage). 경량은 solar-mini

  openai:
    label: "OpenAI"
    kind: openai_compatible
    base_url: https://api.openai.com/v1
    api_key_env: LLM_KEY_OPENAI
    default_model: ""

  ollama:
    label: "Ollama (로컬)"
    kind: openai_compatible
    # 컨테이너 이름이든 IP든 상관없다. 그냥 URL 이다.
    base_url: http://voice-ollama:8301/v1
    api_key_env: LLM_KEY_OLLAMA
    default_model: ""
    # 로컬이므로 키가 없어도 사용 가능
    requires_key: false

  gemini:
    label: "Google Gemini"
    kind: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: LLM_KEY_GEMINI
    default_model: ""

  anthropic:
    label: "Anthropic Claude"
    kind: anthropic
    base_url: https://api.anthropic.com/v1
    api_key_env: LLM_KEY_ANTHROPIC
    default_model: ""
